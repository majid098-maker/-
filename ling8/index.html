const deck=document.getElementById("deck"),nav=document.getElementById("nav");
S.forEach((s,i)=>{const sec=document.createElement("section");sec.className="slide "+(s[4]||"");sec.id="s"+(i+1);sec.dataset.i=i;sec.innerHTML='<div class="frame"><header><div class="eyebrow">'+s[0]+'</div><h2>'+s[1]+'</h2></header><main>'+s[2]+'</main><div class="source">'+s[3]+'</div></div>';deck.appendChild(sec);const a=document.createElement("a");a.href="#s"+(i+1);a.textContent=String(i+1).padStart(2,"0")+" · "+s[0];nav.appendChild(a)});
let cur=0,slides=[...document.querySelectorAll(".slide")],links=[...document.querySelectorAll(".nav a")];links[0].classList.add("active");
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));slides[cur].scrollIntoView({behavior:"smooth"});links.forEach((a,j)=>a.classList.toggle("active",j===cur))}
document.addEventListener("keydown",e=>{if(document.getElementById("modal").classList.contains("on")){if(e.key==="Escape")closeM();return}if(["ArrowDown","ArrowLeft","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1)}if(["ArrowUp","ArrowRight","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}});
new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting&&x.intersectionRatio>.55){cur=+x.target.dataset.i;links.forEach((a,j)=>a.classList.toggle("active",j===cur))}}),{root:deck,threshold:[.55]}).observe(slides[0]);slides.slice(1).forEach(s=>new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting&&x.intersectionRatio>.55){cur=+x.target.dataset.i;links.forEach((a,j)=>a.classList.toggle("active",j===cur))}}),{root:deck,threshold:[.55]}).observe(s));
